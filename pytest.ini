[pytest]
testpaths = tests
asyncio_mode = auto

# Coverage is measured on every run, including a partial one — `pytest -k x`
# measured nothing at all before this. `--cov-branch` because a line that ran
# is not a branch that was taken; it lowers the reported total (66.4% -> 64.8%
# here) because it counts something line coverage does not.
#
# The floor is deliberately NOT here. `--cov-fail-under` in `addopts` fails
# every partial run — `pytest tests/test_llm.py` exits 1 on a passing test,
# including the single-test reproductions `review-workflow.md` R-3 and R-5 ask
# reviewers to run. A floor is a claim about a COMPLETE run, so it lives where
# completeness is known: the CI step, as `PYTEST_ADDOPTS`.
#
# `--cov-precision=2` is what makes the floor mean what it says. coverage.py
# compares `round(total, precision)` against `--cov-fail-under`, and at the
# default precision of 0 that rounds 64.78 to 65 — measured: with the floor at
# the real 64.78, a floor of 65 also passed and only 65.01 refused, so the gate
# would have tolerated a drop to roughly 64.5 without a word. At precision 2,
# 64.78 passes and 64.79 refuses.
#
# This makes `pytest-cov` a hard requirement of anything that loads this ini:
# without it pytest fails to start, rather than running unmeasured. It is
# installed in `Dockerfile.test`, which is the only place these tests run.
#
# `pytest --no-cov -k something` turns measurement off for a tight loop.
# It is a speed switch and nothing depends on it: with the floor out of
# `addopts`, a partial run is green whether or not you pass it.
addopts = --cov=app --cov-branch --cov-precision=2 --cov-report=term-missing
