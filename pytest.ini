[pytest]
testpaths = tests
asyncio_mode = auto

# Coverage is measured on every run, including a partial one — `pytest -k x`
# measured nothing at all before this. `--cov-branch` because a line that ran
# is not a branch that was taken; it lowers the reported total (71.6% -> 69.6%
# here) because it counts something line coverage does not.
#
# The floor is deliberately NOT here. `--cov-fail-under` in `addopts` fails
# every partial run — `pytest tests/test_llm.py` exits 1 on a passing test,
# including the single-test reproductions `review-workflow.md` R-3 and R-5 ask
# reviewers to run. A floor is a claim about a COMPLETE run, so it lives where
# completeness is known: the CI step, as `PYTEST_ADDOPTS`.
#
# The population it measures is corrected by `.coveragerc`, which omits the
# three evaluation harnesses under `app/`. They are dev-time only, reached from
# nothing the service imports, and they were 2676 statements at 33.3% —
# diluting the figure that is supposed to protect the shipped code. Read that
# file, and `tests/test_evals_not_in_runtime.py`, before moving the floor.
#
# `--cov-precision=2` is what makes the floor mean what it says. coverage.py
# compares `round(total, precision)` against `--cov-fail-under`, and at the
# default precision of 0 the comparison is against a whole number.
#
# The floor is `69.64` and NOT `69.65`, and the difference is not cosmetic:
# coverage.py prints its pass/fail message from the raw total and computes its
# exit code from the ROUNDED one, so the two disagree wherever a total rounds
# UP. 69.645762 rounds up, so a floor at the rounded value lands exactly on
# that disagreement. Measured, all three:
#
#     --cov-fail-under=69.64  "reached"      exit 0    <- what we want
#     --cov-fail-under=69.65  "not reached"  exit 0    <- says FAIL, passes
#     --cov-fail-under=69.66  "not reached"  exit 1
#
# Truncate the measured total, never round it, and check the exit code rather
# than the message.
#
# This makes `pytest-cov` a hard requirement of anything that loads this ini:
# without it pytest fails to start, rather than running unmeasured. It is
# installed in `Dockerfile.test`, which is the only place these tests run.
#
# `pytest --no-cov -k something` turns measurement off for a tight loop.
# It is a speed switch and nothing depends on it: with the floor out of
# `addopts`, a partial run is green whether or not you pass it.
#
# `# pragma: no cover` raises this number by taking statements out of the
# denominator. There are 9 in the measured population, holding back 25
# statements and 6 branches. 15 of those statements are uncovered and 10 are
# covered — `app/citations.py` and `app/loop_watchdog.py` contribute nothing but
# covered lines, so those annotations are excluding code that does run under
# test.
#
# Measured at 69.611515% without them against 69.645762% with: +0.034 points.
# `--cov-fail-under=69.64` refuses below 69.635, so the fall this gate will
# tolerate from today's total is 0.010762 points. The nine annotations together
# are worth about three times that resolution. Count them before moving the
# floor.
#
# When re-measuring, keep `.coveragerc`'s `omit` and neutralise ONLY the pragma
# pattern. `exclude_lines` defaults to THREE regexes — the pragma one, `...`
# stub bodies, and `if TYPE_CHECKING:` — so overriding the option wholesale
# re-includes the other two and overstates the annotations. Keep the other two:
#
#     [report]
#     exclude_lines =
#         ^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)
#         if (typing\.)?TYPE_CHECKING:
addopts = --cov=app --cov-branch --cov-precision=2 --cov-report=term-missing
